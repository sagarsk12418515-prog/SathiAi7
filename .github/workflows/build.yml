name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip Project
        run: unzip SathiAI.zip
      - name: Sync All Files & Add Dependencies
        run: |
          cp -r app SathiAI/
          rm -rf SathiAI/.gradle
          rm -rf SathiAI/build
          rm -rf SathiAI/app/build
          rm -f SathiAI/local.properties
          sed -i '/android.aapt2FromMavenOverride/d' SathiAI/gradle.properties
          sed -i '/dependencies {/a \    implementation("androidx.navigation:navigation-compose:2.8.4")' SathiAI/app/build.gradle.kts
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      - name: Build with Gradle
        run: |
          cd SathiAI
          chmod +x gradlew || true
          gradle assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SathiAI-APK
          path: SathiAI/app/build/outputs/apk/debug/app-debug.apk
